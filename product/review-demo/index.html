<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Famora – App Review Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; background: #f5f6f8; color: #1d2129; padding: 24px 16px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #6b7280; margin-bottom: 16px; }
  video { width: 100%; border-radius: 12px; background: #000; box-shadow: 0 2px 12px rgba(0,0,0,.12); display: block; }
  .chapters { margin-top: 18px; background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .chapters h2 { font-size: 14px; color: #374151; margin-bottom: 10px; }
  .chapters a { display: flex; justify-content: space-between; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: #1d2129; font-size: 14px; }
  .chapters a:hover { background: #f0f4ff; }
  .chapters a .t { color: #3b6ef6; font-variant-numeric: tabular-nums; margin-right: 12px; min-width: 52px; }
  .actions { margin-top: 16px; text-align: center; }
  .actions a { display: inline-block; padding: 10px 18px; border-radius: 8px; background: #3b6ef6; color: #fff; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
  <h1>Famora – App Review Demo</h1>
  <p class="sub">Family health diary · Duration 4:49 · com.frankzhou.famora</p>

  <video id="player" src="Famora-AppReview-Demo.mp4" controls preload="metadata" playsinline></video>

  <div class="chapters">
    <h2>Chapters / Key moments</h2>
    <a href="#" data-t="0:00"><span class="t">0:00</span><span>Overview &amp; quick logging</span></a>
    <a href="#" data-t="3:10"><span class="t">3:10</span><span>Family sharing (two devices)</span></a>
    <a href="#" data-t="3:23"><span class="t">3:23</span><span>Paywall &amp; subscription disclosure</span></a>
    <a href="#" data-t="3:45"><span class="t">3:45</span><span>Sandbox purchase</span></a>
    <a href="#" data-t="4:35"><span class="t">4:35</span><span>Clear all data</span></a>
  </div>

  <div class="actions"><a href="Famora-AppReview-Demo.mp4" download>Download video</a></div>

<script>
  var v = document.getElementById('player');
  document.querySelectorAll('.chapters a').forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      var p = a.getAttribute('data-t').split(':');
      v.currentTime = (+p[0]) * 60 + (+p[1]);
      v.play();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
</script>
</body>
</html>
